backend:
  name: turbo-github
  turbo_site_id: 6c9ae2c4-15e4-452a-9484-89e6bc9779c7

media_folder: "img"
public_folder: "/img"

collections:
  - name: "pages"
    label: "Website Editor"
    files:
      - label: "Home Page"
        name: "home"
        file: "content/home.json"
        fields:
          - label: "Main Title"
            name: "title"
            widget: "string"

          - label: "Description"
            name: "description"
            widget: "text"
            
          - label: "About Me Text"
            name: "about_text"
            widget: "text"
            required: false

          - label: "About Me Photo"
            name: "about_image"
            widget: "image"
            required: false

          - label: "Main Photo"
            name: "hero_image"
            widget: "image"
            required: false

          - label: "About Me Text"
            name: "about_text"
            widget: "text"
            required: false

          - label: "About Me Photo"
            name: "about_image"
            widget: "image"
            required: false


          - label: "Animal Portfolio Photo"
            name: "portfolio_animal"
            widget: "image"
            required: false

          - label: "People & Events Portfolio Photo"
            name: "portfolio_people"
            widget: "image"
            required: false

          - label: "Landscape Portfolio Photo"
            name: "portfolio_landscape"
            widget: "image"
            required: false

          - label: "Drone Portfolio Photo"
            name: "portfolio_drone"
            widget: "image"
            required: false
